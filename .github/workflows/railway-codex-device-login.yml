name: Railway Codex device login

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/railway-codex-device-login.yml"
  workflow_dispatch:

jobs:
  login:
    runs-on: [self-hosted, railway, luna]
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Codex CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://chatgpt.com/codex/install.sh | CODEX_NON_INTERACTIVE=1 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Login with ChatGPT device auth
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          echo "Starting ChatGPT device authorization..."
          codex login --device-auth

      - name: Verify persisted login and Luna Max
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          codex login status
          printf '' | codex exec --skip-git-repo-check --ephemeral --sandbox read-only -m gpt-5.6-luna -c model_reasoning_effort=max "Reply with exactly RAILWAY_LUNA_MAX_OK and nothing else."
