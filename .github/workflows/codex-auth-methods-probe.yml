name: Codex auth methods probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/codex-auth-methods-probe.yml"
  workflow_dispatch:

jobs:
  device-auth:
    name: Device auth capability
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install Codex CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://chatgpt.com/codex/install.sh | CODEX_NON_INTERACTIVE=1 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Probe device auth without exposing one-time code
        shell: bash
        run: |
          set +e
          export PATH="$HOME/.local/bin:$PATH"
          rm -f /tmp/codex-device.log
          timeout 12s codex login --device-auth >/tmp/codex-device.log 2>&1
          STATUS=$?
          if grep -Eqi 'disabled|not available|unsupported' /tmp/codex-device.log; then
            RESULT="DEVICE_AUTH_UNAVAILABLE"
          elif grep -Eqi 'device|code|browser|visit|http' /tmp/codex-device.log; then
            RESULT="DEVICE_AUTH_FLOW_STARTED"
          elif [ "$STATUS" -eq 124 ]; then
            RESULT="DEVICE_AUTH_WAITED_FOR_USER"
          else
            RESULT="DEVICE_AUTH_OTHER"
          fi
          echo "device_auth_result=$RESULT"
          echo "device_auth_exit=$STATUS"
          # Never print the raw device-auth output because it may contain a one-time code.
          rm -f /tmp/codex-device.log
          exit 0

  oidc:
    name: GitHub OIDC / OpenAI WIF capability
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check federation configuration and request an OIDC token
        shell: bash
        run: |
          set -euo pipefail

          for name in OPENAI_WIF_AUDIENCE OPENAI_IDENTITY_PROVIDER_ID OPENAI_SERVICE_ACCOUNT_ID OPENAI_FEDERATION_RULE_ID; do
            if [ -n "${!name:-}" ]; then
              echo "$name=present"
            else
              echo "$name=absent"
            fi
          done

          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "github_oidc_request_context=present"
          else
            echo "github_oidc_request_context=absent"
            exit 0
          fi

          AUDIENCE="https://api.openai.com/v1"
          ENCODED_AUDIENCE=$(jq -rn --arg audience "$AUDIENCE" '$audience | @uri')
          RESPONSE=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${ENCODED_AUDIENCE}")
          TOKEN=$(printf '%s' "$RESPONSE" | jq -r .value)
          test -n "$TOKEN"
          echo "github_oidc_token_issued=yes"

          # Decode only non-secret claims; never print the signed token itself.
          PAYLOAD=$(printf '%s' "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | awk '{l=length($0)%4; if(l==2) $0=$0"=="; else if(l==3) $0=$0"="; print}' | base64 -d 2>/dev/null || true)
          printf '%s' "$PAYLOAD" | jq -r '"oidc_iss=" + (.iss // ""), "oidc_aud=" + ((.aud // "")|tostring), "oidc_sub=" + (.sub // ""), "oidc_repository=" + (.repository // ""), "oidc_ref=" + (.ref // "")' 2>/dev/null || true

          if [ -n "${OPENAI_IDENTITY_PROVIDER_ID:-}" ] && [ -n "${OPENAI_SERVICE_ACCOUNT_ID:-}" ] && [ -n "${OPENAI_WIF_AUDIENCE:-}" ]; then
            echo "openai_wif_config_complete=yes"
          else
            echo "openai_wif_config_complete=no"
          fi

  official-action:
    name: Official codex-action without preconfigured key
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Probe official Codex Action requirements
        id: codex
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          prompt: "Reply with exactly CODEX_ACTION_OK"
          model: "gpt-5.6-luna"
          effort: "max"
          sandbox: "read-only"
      - name: Record result
        shell: bash
        run: |
          echo "official_action_outcome=${{ steps.codex.outcome }}"
          echo "official_action_conclusion=${{ steps.codex.conclusion }}"

  cli-options:
    name: Codex auth option surface
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install Codex CLI and inspect supported auth surface
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://chatgpt.com/codex/install.sh | CODEX_NON_INTERACTIVE=1 sh
          export PATH="$HOME/.local/bin:$PATH"
          codex --version
          codex login --help | sed -E 's/[A-Za-z0-9_-]{20,}/[REDACTED]/g' | head -120
          echo "=== config/auth-related environment presence ==="
          env | cut -d= -f1 | grep -E '^(OPENAI|CODEX)_' | sort || true
