name: Railway Codex bootstrap key

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/railway-codex-bootstrap.yml"
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: [self-hosted, railway, luna]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Verify persistent Codex home and generate bootstrap key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /root/.codex
          chmod 700 /root/.codex
          if [ ! -f /root/.codex/bootstrap_private.pem ]; then
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /root/.codex/bootstrap_private.pem
            chmod 600 /root/.codex/bootstrap_private.pem
          fi
          mkdir -p bootstrap
          openssl pkey -in /root/.codex/bootstrap_private.pem -pubout -out bootstrap/railway-codex-public.pem
          printf 'persistent_probe=%s\n' "$(date -u +%FT%TZ)" > /root/.codex/persistent_probe.txt

      - name: Publish public key only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bootstrap/railway-codex-public.pem
          if git diff --cached --quiet; then
            echo "public_key_unchanged=yes"
          else
            git commit -m "test: publish Railway Codex bootstrap public key"
            git push origin HEAD:main
          fi

      - name: Install Codex CLI and report login state
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://chatgpt.com/codex/install.sh | CODEX_NON_INTERACTIVE=1 sh
          export PATH="$HOME/.local/bin:$PATH"
          codex --version
          codex login status || true
