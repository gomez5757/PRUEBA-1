name: Railway persistence probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/railway-persistence-probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, railway, luna]
    permissions:
      contents: read
    steps:
      - name: Inspect Codex home persistence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /root/.codex
          echo "mount_info:"
          findmnt /root/.codex || true
          echo "before:"
          if [ -f /root/.codex/persistence_marker.txt ]; then
            cat /root/.codex/persistence_marker.txt
          else
            echo "marker_absent"
          fi
          if [ ! -f /root/.codex/persistence_marker.txt ]; then
            printf 'created=%s\n' "$(date -u +%FT%TZ)" > /root/.codex/persistence_marker.txt
            chmod 600 /root/.codex/persistence_marker.txt
          fi
          echo "after:"
          cat /root/.codex/persistence_marker.txt
