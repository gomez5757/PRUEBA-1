name: Temporary OmegaTech YouTube downloader test

on:
  push:
    paths:
      - ".github/workflows/temp-youtube-audio-20260923.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test Y2mate-compatible endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -LfsS --get "https://api.omegatech.app/api/download/Yt-mate" \
            --data-urlencode "action=download" \
            --data-urlencode "url=https://youtu.be/_IVxbL4JkE8" \
            --data-urlencode "format=mp3" \
            --data-urlencode "quality=128" | jq .
