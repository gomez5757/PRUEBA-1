name: Temporary Cobalt direct instance sweep

on:
  push:
    paths:
      - ".github/workflows/temp-youtube-audio-20260923.yml"

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Find a working Cobalt instance
        shell: bash
        run: |
          set -euo pipefail
          URL="https://youtu.be/_IVxbL4JkE8"
          : > /tmp/winner
          for API in \
            "https://cobalt-api.meowing.de" \
            "https://cobalt-backend.canine.tools" \
            "https://capi.3kh0.net" \
            "https://cobalt-api.kwiatekmiki.com" \
            "https://kityune.imput.net" \
            "https://nachos.imput.net" \
            "https://sunny.imput.net" \
            "https://blossom.imput.net"; do
            echo "===== TEST $API ====="
            curl -kLfsS --connect-timeout 5 --max-time 10 "$API/" | head -c 400 || true
            echo
            PAYLOAD="$(jq -nc --arg u "$URL" '{url:$u,downloadMode:"audio",audioFormat:"best",filenameStyle:"basic"}')"
            BODY="$(curl -kLsS --connect-timeout 5 --max-time 25 -X POST "$API/" \
              -H 'Accept: application/json' -H 'Content-Type: application/json' \
              --data "$PAYLOAD" 2>/dev/null || true)"
            STATUS="$(printf '%s' "$BODY" | jq -r '.status // empty' 2>/dev/null || true)"
            CODE="$(printf '%s' "$BODY" | jq -r '.error.code // empty' 2>/dev/null || true)"
            echo "status=$STATUS error=$CODE bytes=${#BODY}"
            if [ "$STATUS" = "redirect" ] || [ "$STATUS" = "tunnel" ]; then
              echo "$API" > /tmp/winner
              break
            fi
          done
          API="$(cat /tmp/winner)"
          [ -n "$API" ] || { echo "No working instance"; exit 1; }
          echo "WINNER=$API"
          echo "COBALT_API=$API" >> "$GITHUB_ENV"

      - name: Download and convert all 3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          urls=(
            "https://youtu.be/_IVxbL4JkE8"
            "https://youtu.be/FIZolwe-9Ow"
            "https://youtu.be/81SmjsXtQel"
          )
          n=0
          for URL in "${urls[@]}"; do
            n=$((n+1))
            PAYLOAD="$(jq -nc --arg u "$URL" '{url:$u,downloadMode:"audio",audioFormat:"best",filenameStyle:"basic"}')"
            BODY="$(curl -kLfsS --connect-timeout 8 --max-time 45 -X POST "$COBALT_API/" \
              -H 'Accept: application/json' -H 'Content-Type: application/json' \
              --data "$PAYLOAD")"
            echo "$BODY" | jq .
            STATUS="$(echo "$BODY" | jq -r '.status')"
            DL="$(echo "$BODY" | jq -r '.url // empty')"
            NAME="$(echo "$BODY" | jq -r '.filename // empty')"
            [ "$STATUS" = "redirect" ] || [ "$STATUS" = "tunnel" ] || exit 1
            [ -n "$DL" ] || exit 1
            curl -kLfsS --connect-timeout 10 --max-time 180 "$DL" -o "/tmp/source-$n"
            SAFE="$(printf '%s' "$NAME" | tr '/\\:*?"<>|' '_' | tr -d '\r\n')"
            [ -n "$SAFE" ] || SAFE="audio_$n"
            BASE="${SAFE%.*}"
            ffmpeg -hide_banner -loglevel error -y -i "/tmp/source-$n" -vn -c:a aac -b:a 96k -movflags +faststart "out/$(printf '%02d' "$n")_${BASE}.m4a"
          done
          ls -lh out

      - name: Upload M4A files
        uses: actions/upload-artifact@v4
        with:
          name: youtube-audio-m4a-96k
          path: out/*.m4a
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
