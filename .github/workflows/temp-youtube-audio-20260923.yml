name: Temporary Loader primary response check

on:
  push:
    paths:
      - ".github/workflows/temp-youtube-audio-20260923.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect first response without following redirects
        shell: bash
        run: |
          U="https://aiden90.savenow.to/pacific/?qIM7f1yFJ49k9p5MPn7Vey3"
          curl -ksS -D - -o /tmp/body --max-time 30 \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36' \
            -e 'https://loader.to/' "$U"
          echo "BODY_SIZE=$(stat -c %s /tmp/body)"
