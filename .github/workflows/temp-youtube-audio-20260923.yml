name: Temporary corrected audio download

on:
  push:
    paths:
      - ".github/workflows/temp-youtube-audio-20260923.yml"

permissions: {}

jobs:
  audio:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - idx: "02"
            video_id: "FIZoIwe-9Ow"
          - idx: "03"
            video_id: "81SmjsXtQeI"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install audio tools
        shell: bash
        run: |
          sudo apt-get update -qq > /tmp/install.log 2>&1
          sudo apt-get install -y -qq ffmpeg >> /tmp/install.log 2>&1
          ffmpeg -version | head -1

      - name: Download and validate requested audio
        shell: bash
        env:
          IDX: ${{ matrix.idx }}
          VIDEO_ID: ${{ matrix.video_id }}
        run: |
          set -euo pipefail
          mkdir -p out
          URL="https://youtu.be/$VIDEO_ID"
          curl -fLsS --retry 2 --retry-delay 5 --retry-max-time 240 \
            --connect-timeout 10 --max-time 100 --get \
            'https://api.omegatech.app/api/download/savefrom' \
            --data-urlencode 'action=download' \
            --data-urlencode "url=$URL" \
            --data-urlencode 'quality=128kbps' -o /tmp/meta.json
          jq -e '.success == true and (.data.audioUrl | type == "string")' /tmp/meta.json > /dev/null
          AUDIO="$(jq -r '.data.audioUrl' /tmp/meta.json)"
          TITLE="$(jq -r '.data.title' /tmp/meta.json)"
          case "$AUDIO" in
            https://*/media/"$VIDEO_ID"/*) ;;
            *) echo 'Audio URL does not match requested video'; exit 1 ;;
          esac
          jq '{success,title:.data.title,duration:.data.duration,audioUrl:.data.audioUrl}' /tmp/meta.json
          curl -fLsS --retry 2 --retry-delay 3 --connect-timeout 15 --max-time 240 \
            -A 'Mozilla/5.0' "$AUDIO" -o /tmp/source.mp3
          ffprobe -v error -show_entries format=duration,size -of json /tmp/source.mp3 > /tmp/source-probe.json
          OUT="out/${IDX}_audio.m4a"
          ffmpeg -nostdin -hide_banner -loglevel error -xerror -y -i /tmp/source.mp3 \
            -map 0:a:0 -vn -map_metadata -1 -metadata "title=$TITLE" \
            -metadata "comment=$URL" -c:a aac -b:a 96k -movflags +faststart "$OUT"
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,codec_type,bit_rate \
            -of json "$OUT" > /tmp/output-probe.json
          python3 - <<'PY'
          import json
          src=json.load(open('/tmp/source-probe.json'))
          out=json.load(open('/tmp/output-probe.json'))
          a=float(src['format']['duration']); b=float(out['format']['duration'])
          assert a>30 and abs(a-b)<2, (a,b)
          assert len(out['streams'])==1 and out['streams'][0]['codec_type']=='audio'
          assert int(out['format']['size'])>100000
          print(json.dumps(out,ensure_ascii=False))
          PY
          ffmpeg -nostdin -v error -xerror -i "$OUT" -map 0:a:0 -f null -

      - name: Store validated audio
        uses: actions/upload-artifact@v4
        with:
          name: audio-${{ matrix.idx }}-corrected
          path: out/*.m4a
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
