name: Temporary OmegaTech docs internals

on:
  push:
    paths:
      - ".github/workflows/temp-youtube-audio-20260923.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public docs loader
        shell: bash
        run: |
          set -euo pipefail
          curl -LfsS https://api.omegatech.app/api.html -o /tmp/api.html
          echo "=== fetch/XHR/config references ==="
          grep -Ein 'fetch\(|axios|endpoints|api[-_]?data|manifest|json|handshake|gateway|baseUrl|baseURL|apiHost|API_HOST' /tmp/api.html | head -240 || true
          echo "=== URL/path literals ==="
          grep -Eo 'https?://[^"<> ]+|/[A-Za-z0-9._/-]+\.(json|js)|/api/[A-Za-z0-9_?=&./:-]+' /tmp/api.html | sort -u | head -300 || true
