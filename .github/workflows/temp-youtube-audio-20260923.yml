name: Temporary OmegaTech downloader tests

on:
  push:
    paths:
      - ".github/workflows/temp-youtube-audio-20260923.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Test public YouTube audio endpoints
        shell: bash
        run: |
          set +e
          URL="https://youtu.be/_IVxbL4JkE8"

          echo "=== YouTube action=audio ==="
          curl -LsS --get "https://api.omegatech.app/api/download/YouTube" \
            --data-urlencode "action=audio" --data-urlencode "url=$URL" \
            -w '\nHTTP=%{http_code}\n' | head -c 12000
          echo

          echo "=== SaveTube action=download 128kbps ==="
          curl -LsS --get "https://api.omegatech.app/api/download/savefrom" \
            --data-urlencode "action=download" --data-urlencode "url=$URL" \
            --data-urlencode "quality=128kbps" -w '\nHTTP=%{http_code}\n' | head -c 12000
          echo

          echo "=== Yt-mate action=info ==="
          curl -LsS --get "https://api.omegatech.app/api/download/Yt-mate" \
            --data-urlencode "action=info" --data-urlencode "url=$URL" \
            -w '\nHTTP=%{http_code}\n' | head -c 12000
          echo
          exit 0
