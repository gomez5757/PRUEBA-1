name: Temporary YouTube metadata lookup

on:
  push:
    paths:
      - ".github/workflows/temp-youtube-audio-20260923.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get oEmbed metadata
        shell: bash
        run: |
          set +e
          for ID in "_IVxbL4JkE8" "FIZolwe-9Ow" "81SmjsXtQel"; do
            echo "===== $ID ====="
            curl -LfsS --max-time 15 "https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=$ID&format=json" | jq -r '"title=" + .title + " | author=" + .author_name'
            echo "exit=$?"
          done
          exit 0
