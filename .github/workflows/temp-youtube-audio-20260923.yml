name: Temporary inspect iVoox episode page

on:
  push:
    paths:
      - ".github/workflows/temp-youtube-audio-20260923.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect iVoox raw HTML
        shell: bash
        run: |
          set -euo pipefail
          U="https://www.ivoox.com/informes-del-cni-dejan-al-descubierto-al-audios-mp3_rf_180328233_1.html"
          curl -LfsS --max-time 30 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36' "$U" -o page.html
          echo "bytes=$(wc -c < page.html)"
          python - <<'PY'
          import re,html
          s=html.unescape(open("page.html",errors="ignore").read())
          for key in ["audio","mp3","m3u8","triton","preview","mediaUrl","player","duration","180328233"]:
              print("KEY",key,"count",s.lower().count(key.lower()))
          # URLs that look media-ish
          urls=[]
          for m in re.findall(r'https?://[^"\'<>\\ ]+',s):
              if any(k in m.lower() for k in ('.mp3','.m4a','.m3u8','triton','audio','stream','player')):
                  if m not in urls: urls.append(m)
          for u in urls[:100]:
              print("URL:",u[:1600])
          # snippets around likely keys
          for key in ["180328233","preview","triton","audioUrl","mediaUrl","playerData","stream"]:
              pos=0
              cnt=0
              low=s.lower(); kk=key.lower()
              while True:
                  i=low.find(kk,pos)
                  if i<0 or cnt>=8: break
                  print("SNIP",key,":",re.sub(r'\s+',' ',s[max(0,i-350):i+1000])[:1400])
                  pos=i+len(kk); cnt+=1
          PY
