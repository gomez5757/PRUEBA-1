name: Temporary Piped instance sweep

on:
  push:
    paths:
      - ".github/workflows/temp-youtube-audio-20260923.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Test remaining current Piped instances
        shell: bash
        run: |
          set +e
          ID="_IVxbL4JkE8"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36"
          for BASE in \
            "https://pipedapi-libre.kavin.rocks" \
            "https://piped-api.privacy.com.de" \
            "https://pipedapi.adminforge.de" \
            "https://api.piped.yt" \
            "https://pipedapi.drgns.space" \
            "https://pipedapi.owo.si" \
            "https://piped-api.codespace.cz" \
            "https://pipedapi.darkness.services" \
            "https://pipedapi.orangenet.cc"; do
            echo "===== $BASE ====="
            TMP="$(mktemp)"
            CODE="$(curl -L -A "$UA" -sS --max-time 12 -o "$TMP" -w "%{http_code}" "$BASE/streams/$ID" 2>/dev/null)"
            echo "status=$CODE bytes=$(wc -c < "$TMP")"
            if [ "$CODE" = "200" ]; then
              jq -r '"title=" + (.title // "null") + " audioStreams=" + ((.audioStreams // [])|length|tostring)' "$TMP" 2>/dev/null
            else
              head -c 180 "$TMP" | tr '\n' ' '; echo
            fi
            rm -f "$TMP"
          done
          exit 0
