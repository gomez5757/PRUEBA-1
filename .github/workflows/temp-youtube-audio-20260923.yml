name: Temporary YouTube extraction test

on:
  push:
    paths:
      - ".github/workflows/temp-youtube-audio-20260923.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install yt-dlp and Deno
        shell: bash
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          python -m pip install -U "yt-dlp[default]"

      - name: Test anonymous YouTube clients
        shell: bash
        run: |
          set +e
          URL="https://youtu.be/_IVxbL4JkE8"
          for CLIENT in android_vr web_safari web_embedded tv; do
            echo "===== CLIENT $CLIENT ====="
            yt-dlp --js-runtimes "deno:$HOME/.deno/bin/deno" \
              --extractor-args "youtube:player_client=$CLIENT;player_skip=webpage,configs" \
              --no-playlist -F "$URL"
            echo "EXIT=$?"
          done
          exit 0
