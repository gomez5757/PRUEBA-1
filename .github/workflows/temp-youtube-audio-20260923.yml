name: Temporary inspect iVoox enclosure delivery

on:
  push:
    paths:
      - ".github/workflows/temp-youtube-audio-20260923.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect redirects and range headers
        shell: bash
        run: |
          set -euo pipefail
          URL='https://www.ivoox.com/informes-del-cni-dejan-al-descubierto-al_mf_180328233_feed_1.mp3?d=1788981014'
          for UA in \
            'curl/8.5.0' \
            'PodcastAddict/v2026 Android' \
            'AntennaPod/3.8.0' \
            'Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/153 Mobile Safari/537.36'; do
            echo "===== UA: $UA ====="
            rm -f headers part.bin
            curl -L -sS --max-time 30 -A "$UA" -r 0-1023 -D headers -o part.bin \
              -w 'HTTP=%{http_code} EFFECTIVE=%{url_effective} SIZE=%{size_download} TYPE=%{content_type}\n' "$URL"
            echo "--- final/interesting headers ---"
            grep -Ei '^(HTTP/|location:|content-length:|content-range:|accept-ranges:|content-type:)' headers | tail -n 20 || true
            echo "part_size=$(wc -c < part.bin)"
          done
