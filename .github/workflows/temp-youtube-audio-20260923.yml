name: Temporary YouTube thumbnail lookup

on:
  push:
    paths:
      - ".github/workflows/temp-youtube-audio-20260923.yml"

jobs:
  thumbs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download thumbnails
        shell: bash
        run: |
          set -e
          mkdir thumbs
          curl -LfsS "https://i.ytimg.com/vi/_IVxbL4JkE8/hqdefault.jpg" -o thumbs/1.jpg
          curl -LfsS "https://i.ytimg.com/vi/FIZolwe-9Ow/hqdefault.jpg" -o thumbs/2.jpg
          curl -LfsS "https://i.ytimg.com/vi/81SmjsXtQel/hqdefault.jpg" -o thumbs/3.jpg
          file thumbs/*
          ls -lh thumbs
      - name: Upload thumbnails
        uses: actions/upload-artifact@v4
        with:
          name: youtube-thumbnails
          path: thumbs/*.jpg
          retention-days: 1
