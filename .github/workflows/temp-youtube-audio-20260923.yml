name: Temporary alternative YouTube frontend test

on:
  push:
    paths:
      - ".github/workflows/temp-youtube-audio-20260923.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Test Piped and Invidious public APIs
        shell: bash
        run: |
          set +e
          ID="_IVxbL4JkE8"
          for BASE in \
            "https://pipedapi.kavin.rocks" \
            "https://pipedapi.leptons.xyz" \
            "https://pipedapi.nosebs.ru" \
            "https://api-piped.mha.fi" \
            "https://piped-api.garudalinux.org" \
            "https://api.piped.private.coffee" \
            "https://pipedapi.ducks.party" \
            "https://pipedapi.reallyaweso.me"; do
            echo "===== PIPED $BASE ====="
            BODY="$(curl -LfsS --max-time 20 "$BASE/streams/$ID" 2>/dev/null)"
            RC=$?
            echo "curl=$RC bytes=${#BODY}"
            if [ $RC -eq 0 ] && [ -n "$BODY" ]; then
              echo "$BODY" | jq -r '"title=" + (.title // "null") + " audioStreams=" + ((.audioStreams // [])|length|tostring) + " msg=" + (.message // .error // "")' 2>/dev/null
            fi
          done

          for BASE in \
            "https://inv.nadeko.net" \
            "https://invidious.nerdvpn.de" \
            "https://yt.chocolatemoo53.com" \
            "https://invidious.tiekoetter.com"; do
            echo "===== INVIDIOUS $BASE ====="
            BODY="$(curl -LfsS --max-time 20 "$BASE/api/v1/videos/$ID" 2>/dev/null)"
            RC=$?
            echo "curl=$RC bytes=${#BODY}"
            if [ $RC -eq 0 ] && [ -n "$BODY" ]; then
              echo "$BODY" | jq -r '"title=" + (.title // "null") + " adaptiveFormats=" + ((.adaptiveFormats // [])|length|tostring) + " err=" + (.error // "")' 2>/dev/null
            fi
          done
          exit 0
