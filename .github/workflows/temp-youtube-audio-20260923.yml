name: Temporary OmegaTech endpoint discovery

on:
  push:
    paths:
      - ".github/workflows/temp-youtube-audio-20260923.yml"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read public OpenAPI index
        shell: bash
        run: |
          set -euo pipefail
          curl -LfsS https://api.omegatech.app/openapi.json -o /tmp/openapi.json
          echo "=== top-level ==="
          jq '{baseURL, count:(.endpoints|length)}' /tmp/openapi.json
          echo "=== YouTube/downloader matches ==="
          jq -c '.endpoints[] | select(((.name // "") + " " + (.description // "") + " " + (.category // "") + " " + (.path // "") + " " + (.url // "")) | ascii_downcase | test("youtube|ytmp3|downloader|mp3|mp4"))' /tmp/openapi.json | head -120
