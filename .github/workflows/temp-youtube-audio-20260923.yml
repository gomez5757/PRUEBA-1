name: Temporary Loader download header check

on:
  push:
    paths:
      - ".github/workflows/temp-youtube-audio-20260923.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect download URL headers
        shell: bash
        run: |
          set +e
          for U in \
            "https://aiden90.savenow.to/pacific/?qIM7f1yFJ49k9p5MPn7Vey3" \
            "https://179-43-156-194.nip.io/pacific/?qIM7f1yFJ49k9p5MPn7Vey3" \
            "https://179-43-156-194.sslip.io/pacific/?qIM7f1yFJ49k9p5MPn7Vey3" \
            "http://179-43-156-194.traefik.me/pacific/?qIM7f1yFJ49k9p5MPn7Vey3"; do
            echo "===== $U ====="
            curl -ksSIL --max-time 30 -A 'Mozilla/5.0' -e 'https://loader.to/' "$U" | grep -Ei 'HTTP/|content-type|content-length|content-disposition|location' | tail -20
          done
          exit 0
