name: Temporary alternate source test

on:
  push:
    paths:
      - ".github/workflows/temp-youtube-audio-20260923.yml"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - idx: "02"
            url: "https://youtu.be/FIZolwe-9Ow"
          - idx: "03"
            url: "https://youtu.be/81SmjsXtQel"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test OmegaTech yt-dl 144p
        shell: bash
        env:
          VIDEO_URL: ${{ matrix.url }}
        run: |
          set +e
          curl -LsS --connect-timeout 8 --max-time 50 --get \
            "https://api.omegatech.app/api/download/yt-dl" \
            --data-urlencode "action=download" \
            --data-urlencode "url=$VIDEO_URL" \
            --data-urlencode "quality=144p" \
            -w '\nHTTP=%{http_code}\n' | head -c 20000
          echo
          exit 0
