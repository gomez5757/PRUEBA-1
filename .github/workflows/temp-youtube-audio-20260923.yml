name: Temporary Piped instance sweep

on:
  push:
    paths:
      - ".github/workflows/temp-youtube-audio-20260923.yml"

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Sweep current Piped instances
        shell: bash
        run: |
          set +e
          ID="_IVxbL4JkE8"
          for BASE in \
            "https://pipedapi-libre.kavin.rocks" \
            "https://piped-api.privacy.com.de" \
            "https://pipedapi.adminforge.de" \
            "https://api.piped.yt" \
            "https://pipedapi.drgns.space" \
            "https://pipedapi.owo.si" \
            "https://piped-api.codespace.cz" \
            "https://pipedapi.darkness.services" \
            "https://pipedapi.orangenet.cc" \
            "https://pipedapi.12a.app" \
            "https://api.piped.minionflo.net" \
            "https://pipedapi.nezumi.party"; do
            echo "===== $BASE ====="
            BODY="$(curl -A 'Mozilla/5.0' -LfsS --connect-timeout 6 --max-time 18 "$BASE/streams/$ID" 2>/dev/null)"
            RC=$?
            echo "curl=$RC bytes=${#BODY}"
            if [ $RC -eq 0 ] && [ -n "$BODY" ]; then
              echo "$BODY" | jq -r '"title=" + (.title // "null") + " audios=" + ((.audioStreams // [])|length|tostring) + " error=" + (.message // .error // "")'
              echo "$BODY" | jq -r '(.audioStreams // []) | sort_by(.bitrate) | reverse | .[:3][]? | "AUDIO bitrate=" + (.bitrate|tostring) + " mime=" + (.mimeType // "") + " url=" + (.url // "")'
            fi
          done
          exit 0
