name: Temporary alternative API diagnostics

on:
  push:
    paths:
      - ".github/workflows/temp-youtube-audio-20260923.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose Piped and Invidious
        shell: bash
        run: |
          set +e
          ID="_IVxbL4JkE8"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36"
          for URL in             "https://pipedapi.kavin.rocks/streams/$ID"             "https://pipedapi.leptons.xyz/streams/$ID"             "https://api.piped.private.coffee/streams/$ID"             "https://pipedapi.ducks.party/streams/$ID"             "https://inv.nadeko.net/api/v1/videos/$ID"             "https://yt.chocolatemoo53.com/api/v1/videos/$ID"             "https://invidious.tiekoetter.com/api/v1/videos/$ID"; do
            echo "===== $URL ====="
            TMP="$(mktemp)"
            CODE="$(curl -L -A "$UA" -sS --max-time 15 -o "$TMP" -w "%{http_code}" "$URL" 2>&1)"
            echo "status=$CODE bytes=$(wc -c < "$TMP")"
            head -c 300 "$TMP" | tr '\n' ' '; echo
            rm -f "$TMP"
          done
          exit 0
