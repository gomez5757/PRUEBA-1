name: Temporary inspect En Libertad RSS

on:
  push:
    paths:
      - ".github/workflows/temp-youtube-audio-20260923.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect RSS enclosures
        shell: bash
        run: |
          set -euo pipefail
          curl -LfsS --retry 3 "https://feeds.ivoox.com/feed_fg_f1781509_filtro_1.xml" -o feed.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse("feed.xml").getroot()
          needles=[
              "Los informes del CNI dejan al descubierto al Gobierno",
              "La traición del Gobierno al pueblo español",
              "La Junta Electoral tumba el plan de Sánchez",
          ]
          for item in root.findall(".//item"):
              title=(item.findtext("title") or "").strip()
              if any(n.lower() in title.lower() for n in needles):
                  enc=item.find("enclosure")
                  print("TITLE:", title)
                  print("GUID:", (item.findtext("guid") or "").strip())
                  print("PUB:", (item.findtext("pubDate") or "").strip())
                  print("ENC:", enc.attrib.get("url") if enc is not None else "")
                  print("LEN:", enc.attrib.get("length") if enc is not None else "")
                  print("TYPE:", enc.attrib.get("type") if enc is not None else "")
                  print("---")
          PY
