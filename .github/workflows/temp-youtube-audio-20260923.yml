name: Temporary YouTube browser-token test

on:
  push:
    paths:
      - ".github/workflows/temp-youtube-audio-20260923.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install tools
        shell: bash
        run: |
          set -e
          curl -fsSL https://deno.land/install.sh | sh
          python -m pip install -U "yt-dlp[default]" yt-dlp-getpot-wpc
          command -v google-chrome || command -v chromium || true
          command -v xvfb-run || true

      - name: Test first video with browser PO token
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium)"
          xvfb-run -a yt-dlp -v --js-runtimes "deno:$HOME/.deno/bin/deno" \
            --extractor-args "youtubepot-wpc:browser_path=$CHROME" \
            --extractor-args "youtube:player_client=mweb" \
            --no-playlist -F "https://www.youtube.com/watch?v=_IVxbL4JkE8"
