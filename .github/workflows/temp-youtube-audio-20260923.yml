name: Temporary inspect podcast mirrors

on:
  push:
    paths:
      - ".github/workflows/temp-youtube-audio-20260923.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect raw pages for media URLs
        shell: bash
        run: |
          set -euo pipefail
          URLS=(
            "https://zeno.fm/podcast/en-libertad-wwin0z/episodes/la-junta-electoral-tumba-el-plan-de-sanchez/"
            "https://podsearch.io/episodes/la-junta-electoral-tumba-el-plan-de-sanchez"
            "https://www.podscan.fm/podcasts/en-libertad/episodes/la-junta-electoral-tumba-el-plan-de-sanchez-1"
          )
          n=0
          for U in "${URLS[@]}"; do
            n=$((n+1))
            echo "===== PAGE $n $U ====="
            curl -LfsS --max-time 30 -A 'Mozilla/5.0' "$U" -o "p$n.html" || true
            echo "bytes=$(wc -c < "p$n.html")"
            python - "$n" <<'PY'
          import re,sys,html
          n=sys.argv[1]
          s=open(f"p{n}.html",errors="ignore").read()
          s=html.unescape(s)
          pats=[
              r'https?://[^"\'<> ]+\.mp3[^"\'<> ]*',
              r'https?://[^"\'<> ]+\.m4a[^"\'<> ]*',
              r'https?://[^"\'<> ]+\.m3u8[^"\'<> ]*',
              r'https?://[^"\'<> ]+(?:audio|stream)[^"\'<> ]*',
          ]
          seen=[]
          for pat in pats:
              for m in re.findall(pat,s,re.I):
                  if m not in seen:
                      seen.append(m)
          for m in seen[:50]:
              print("MEDIA:",m[:1000])
          for key in ["audioUrl","audio_url","streamUrl","stream_url","enclosure","episodeUrl","downloadUrl","mediaUrl","media_url"]:
              if key.lower() in s.lower():
                  print("HASKEY:",key)
          PY
          done
