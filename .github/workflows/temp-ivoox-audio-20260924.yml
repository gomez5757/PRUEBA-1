name: Temporary inspect Zeno episode source

on:
  push:
    paths:
      - ".github/workflows/temp-ivoox-audio-20260924.yml"

permissions: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect Zeno podcast page and assets
        shell: bash
        run: |
          set -euo pipefail
          URL='https://zeno.fm/podcast/en-libertad-aiierp/'
          curl -LfsS --connect-timeout 10 --max-time 45 -A 'Mozilla/5.0' "$URL" -o /tmp/zeno.html
          echo "SIZE=$(stat -c %s /tmp/zeno.html)"
          echo '=== title context ==='
          grep -Fio -C 2 'La traición del Gobierno al pueblo español' /tmp/zeno.html | head -40 || true
          echo '=== likely audio/media urls ==='
          grep -Eo 'https?://[^"'"'"' <>]+' /tmp/zeno.html             | grep -Ei '(mp3|audio|podcast|stream|cdn)' | head -200 || true
          echo '=== Next/JSON markers ==='
          grep -Eio '.{0,120}(audioUrl|mediaUrl|enclosure|episodeUrl|streamUrl|mp3|180381816).{0,300}' /tmp/zeno.html | head -160 || true
          echo '=== scripts ==='
          grep -Eo '<script[^>]+src="[^"]+"' /tmp/zeno.html             | sed -E 's/.*src="([^"]+)".*/\1/' | head -80 || true
