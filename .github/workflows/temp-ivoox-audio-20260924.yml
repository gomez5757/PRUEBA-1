name: Temporary test actual iVoox vcore audio API

on:
  push:
    paths:
      - ".github/workflows/temp-ivoox-audio-20260924.yml"

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Query discovered vcore public endpoints
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://vcore-web.ivoox.com/v1'
          ID='180381816'
          for PTH in "/public/audios/$ID" "/public/audios/$ID/download-url"; do
            U="$BASE$PTH"
            echo "===== $U ====="
            curl -LfsS --connect-timeout 8 --max-time 30               -H 'Accept: application/json, text/plain, */*'               -H 'Accept-Language: en'               -H 'Origin: https://www.ivoox.com'               -H 'Referer: https://www.ivoox.com/'               -A 'Mozilla/5.0' "$U" | tee /tmp/resp.json
            echo
            jq . /tmp/resp.json 2>/dev/null || true
          done
