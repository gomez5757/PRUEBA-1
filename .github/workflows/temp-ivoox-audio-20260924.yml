name: Temporary inspect iVoox player internals

on:
  push:
    paths:
      - ".github/workflows/temp-ivoox-audio-20260924.yml"

permissions: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect HTML around player controls and JS assets
        shell: bash
        run: |
          set -euo pipefail
          U='https://www.ivoox.com/en/traicion-del-gobierno-al-pueblo-espanol-audios-mp3_rf_180381816_1.html'
          curl -LfsS --connect-timeout 10 --max-time 45 -A 'Mozilla/5.0' "$U" -o /tmp/page.html
          echo "HTML_SIZE=$(stat -c %s /tmp/page.html)"
          echo '=== play button contexts ==='
          python3 - <<'PY'
          import re
          s=open('/tmp/page.html',encoding='utf-8',errors='ignore').read()
          pats=['play-1','180381816','data-audio','audioUrl','player','podcast-player','mediaUrl']
          for p in pats:
              print('\n###',p)
              for m in list(re.finditer(re.escape(p),s,re.I))[:20]:
                  a=max(0,m.start()-700); b=min(len(s),m.end()+1400)
                  print(s[a:b].replace('\n',' ')[:2300])
                  print('\n---')
          PY
          echo '=== script src ==='
          grep -Eo '<script[^>]+src="[^"]+"' /tmp/page.html | sed -E 's/.*src="([^"]+)".*/\1/' | sort -u | tee /tmp/scripts.txt
          echo '=== scan scripts for player/audio/API clues ==='
          while read -r S; do
            case "$S" in
              http*) X="$S" ;;
              //*) X="https:$S" ;;
              /*) X="https://www.ivoox.com$S" ;;
              *) X="https://www.ivoox.com/en/$S" ;;
            esac
            echo "### $X"
            curl -LfsS --connect-timeout 8 --max-time 30 -A 'Mozilla/5.0' "$X" 2>/dev/null               | grep -Eio '.{0,160}(180381816|play-1|player|audio|enclosure|media|stream|episode|api/).{0,360}'               | head -120 || true
          done < /tmp/scripts.txt
