name: Temporary test iVoox podcast user agents

on:
  push:
    paths:
      - ".github/workflows/temp-ivoox-audio-20260924.yml"

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Test user agents against RSS enclosure
        shell: bash
        run: |
          set -euo pipefail
          U='https://www.ivoox.com/traicion-del-gobierno-al-pueblo-espanol_mf_180381816_feed_1.mp3?d=1789067318'
          uas=(
            'Mozilla/5.0'
            'iVoox/2.15(134) (Linux; Android 7.2; Scale/1.0)'
            'AntennaPod/3.5.0'
            'Podcasts/3.6 CFNetwork/1498.700.2 Darwin/23.6.0'
            'AppleCoreMedia/1.0.0.21G93 (iPhone; U; CPU OS 17_6 like Mac OS X; en_us)'
          )
          for ua in "${uas[@]}"; do
            echo "===== UA: $ua ====="
            curl -LsS -I --connect-timeout 10 --max-time 30 -A "$ua" "$U"               | grep -Ei 'HTTP/|content-type|content-length|content-disposition|location' | tail -30 || true
          done
