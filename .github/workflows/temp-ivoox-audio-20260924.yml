name: Temporary verify iVoox source

on:
  push:
    paths:
      - ".github/workflows/temp-ivoox-audio-20260924.yml"

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check candidate direct audio URLs
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://www.ivoox.com/informes-del-cni-dejan-al-descubierto-al-gobierno_mf_180328233_feed_1.mp3"
            "https://www.ivoox.com/traicion-del-gobierno-al-pueblo-espanol_mf_180381816_feed_1.mp3"
            "https://www.ivoox.com/junta-electoral-tumba-plan-sanchez_mf_180552857_feed_1.mp3"
          )
          n=0
          for u in "${urls[@]}"; do
            n=$((n+1))
            echo "===== $n ====="
            echo "$u"
            curl -LsS -I --connect-timeout 10 --max-time 30 "$u" | grep -Ei 'HTTP/|content-type|content-length|content-disposition|location' | tail -30 || true
          done
