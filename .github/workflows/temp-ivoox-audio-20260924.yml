name: Temporary inspect iVoox player implementation

on:
  push:
    paths:
      - ".github/workflows/temp-ivoox-audio-20260924.yml"

permissions: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Extract player class source from public JS
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://www.ivoox.com/en/traicion-del-gobierno-al-pueblo-espanol-audios-mp3_rf_180381816_1.html'
          curl -LfsS -A 'Mozilla/5.0' "$PAGE" -o /tmp/page.html
          grep -Eo 'https://static-nweb\.ivoox\.com/[A-Za-z0-9._-]+\.js' /tmp/page.html | sort -u > /tmp/jsurls.txt
          mkdir -p /tmp/js
          n=0
          while read -r U; do
            n=$((n+1))
            curl -LfsS --connect-timeout 8 --max-time 30 "$U" -o "/tmp/js/$n.js" || true
          done < /tmp/jsurls.txt
          python3 - <<'PY'
          import glob,re,os
          for fn in glob.glob('/tmp/js/*.js'):
              s=open(fn,encoding='utf-8',errors='ignore').read()
              for needle in ['key:"play"','key:"toggle"','key:"setAudio"']:
                  pos=s.find(needle)
                  if pos>=0:
                      a=max(0,pos-1800); b=min(len(s),pos+5000)
                      print('===== FILE',os.path.basename(fn),'NEEDLE',needle,'=====')
                      print(s[a:b])
                      print('\n---END---')
          PY
