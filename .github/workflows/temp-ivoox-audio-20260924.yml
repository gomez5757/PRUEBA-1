name: Temporary test iVoox media hosts

on:
  push:
    paths:
      - ".github/workflows/temp-ivoox-audio-20260924.yml"

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve fresh token and test media hosts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/tmp/install.log 2>&1
          ID='180381816'
          META="$(curl -LfsS -H 'Accept: application/json' -H 'Origin: https://www.ivoox.com' -H 'Referer: https://www.ivoox.com/' -A 'Mozilla/5.0' "https://vcore-web.ivoox.com/v1/public/audios/$ID")"
          DLJ="$(curl -LfsS -H 'Accept: application/json' -H 'Origin: https://www.ivoox.com' -H 'Referer: https://www.ivoox.com/' -A 'Mozilla/5.0' "https://vcore-web.ivoox.com/v1/public/audios/$ID/download-url")"
          RELD="$(echo "$DLJ" | jq -r '.data.downloadUrl')"
          RELM="$(echo "$META" | jq -r '.data.mediaUrl')"
          echo "RELD=$RELD"
          echo "RELM=$RELM"
          for HOST in 'https://files.ivoox.com' 'https://www.ivoox.com' 'https://vclassic-web-api.ivoox.com'; do
            for REL in "$RELD" "$RELM"; do
              U="$HOST$REL"
              echo "===== $U ====="
              curl -sSI --connect-timeout 10 --max-time 30 -A 'Mozilla/5.0'                 -H 'Accept: audio/mpeg,audio/*;q=0.9,*/*;q=0.1'                 -H 'Referer: https://www.ivoox.com/' "$U"                 | grep -Ei 'HTTP/|content-type|content-length|content-disposition|location' | tail -30 || true
              OUT="/tmp/test-$(echo "$HOST$REL" | sha1sum | cut -d' ' -f1)"
              curl -fsS --range 0-1048575 --connect-timeout 10 --max-time 30 -A 'Mozilla/5.0'                 -H 'Accept: audio/mpeg,audio/*;q=0.9,*/*;q=0.1'                 -H 'Referer: https://www.ivoox.com/' "$U" -o "$OUT" || true
              file "$OUT" 2>/dev/null || true
              stat -c '%s bytes' "$OUT" 2>/dev/null || true
            done
          done
