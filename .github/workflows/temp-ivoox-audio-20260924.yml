name: Temporary inspect iVoox web player

on:
  push:
    paths:
      - ".github/workflows/temp-ivoox-audio-20260924.yml"

permissions: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Chromium automation
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb >/tmp/install.log 2>&1
          mkdir -p /tmp/browser && cd /tmp/browser
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@latest >/dev/null 2>&1
          google-chrome --version

      - name: Capture iVoox player network
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/browser/inspect.js <<'NODE'
          const puppeteer = require('puppeteer-core');
          const target = 'https://www.ivoox.com/traicion-del-gobierno-al-pueblo-espanol-audios-mp3_rf_180381816_1.html';
          const interesting = /mp3|audio|triton|cloudfront|play|stream|media|180381816|download/i;
          (async()=>{
            const browser=await puppeteer.launch({
              executablePath:'/usr/bin/google-chrome', headless:false,
              args:['--no-sandbox','--disable-dev-shm-usage','--window-size=1365,900']
            });
            const page=await browser.newPage();
            await page.setUserAgent('Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36');
            page.on('request', req=>{ if(interesting.test(req.url())) console.log('REQ',req.resourceType(),req.method(),req.url()); });
            page.on('response', res=>{ if(interesting.test(res.url())) console.log('RES',res.status(),res.request().resourceType(),res.url(),JSON.stringify(res.headers()).slice(0,700)); });
            await page.goto(target,{waitUntil:'domcontentloaded',timeout:60000});
            await new Promise(r=>setTimeout(r,7000));
            console.log('TITLE',await page.title());
            console.log('AUDIO_TAGS',await page.evaluate(()=>[...document.querySelectorAll('audio')].map(a=>({src:a.src,currentSrc:a.currentSrc,outer:a.outerHTML.slice(0,800)}))));
            console.log('BUTTONS',await page.evaluate(()=>[...document.querySelectorAll('button,a')].map((e,i)=>({i,txt:(e.innerText||'').trim().slice(0,100),aria:e.getAttribute('aria-label'),title:e.getAttribute('title'),cls:e.className})).filter(x=>/play|reproduc|escuchar/i.test((x.txt||'')+' '+(x.aria||'')+' '+(x.title||''))).slice(0,30)));
            // Try likely play controls by text/aria/title/classes.
            const clicked = await page.evaluate(()=>{
              const all=[...document.querySelectorAll('button,a,[role=button]')];
              const el=all.find(e=>/play|reproducir|escuchar/i.test(((e.innerText||'')+' '+(e.getAttribute('aria-label')||'')+' '+(e.getAttribute('title')||'')+' '+(e.className||''))));
              if(el){ el.click(); return {tag:el.tagName,txt:(el.innerText||'').trim(),aria:el.getAttribute('aria-label'),cls:String(el.className)}; }
              return null;
            });
            console.log('CLICKED',clicked);
            await new Promise(r=>setTimeout(r,12000));
            console.log('AUDIO_AFTER',await page.evaluate(()=>[...document.querySelectorAll('audio')].map(a=>({src:a.src,currentSrc:a.currentSrc,duration:a.duration,currentTime:a.currentTime,paused:a.paused}))));
            const entries=await page.evaluate(()=>performance.getEntriesByType('resource').map(e=>e.name).filter(u=>/mp3|audio|triton|cloudfront|stream|180381816/i.test(u)));
            console.log('PERF',entries.slice(-100));
            await browser.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
          cd /tmp/browser
          xvfb-run -a node inspect.js
