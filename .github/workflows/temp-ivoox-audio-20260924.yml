name: Temporary test iVoox public audio API

on:
  push:
    paths:
      - ".github/workflows/temp-ivoox-audio-20260924.yml"

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Test public audio and download-url endpoints
        shell: bash
        run: |
          set +e
          ID='180381816'
          for BASE in             'https://www.ivoox.com'             'https://api.ivoox.com'             'https://api.ivoox.com/v1'             'https://api.ivoox.com/v2'; do
            for PATH in "/public/audios/$ID" "/public/audios/$ID/download-url"; do
              U="$BASE$PATH"
              echo "===== $U ====="
              curl -LsS --connect-timeout 8 --max-time 30 -A 'Mozilla/5.0'                 -H 'Accept: application/json, text/plain, */*'                 -w '\nHTTP=%{http_code} TYPE=%{content_type}\n' "$U" | head -c 12000
              echo
            done
          done
          exit 0
