name: Temporary inspect iVoox player event handler

on:
  push:
    paths:
      - ".github/workflows/temp-ivoox-audio-20260924.yml"

permissions: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Extract player event listeners and media URL construction
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://www.ivoox.com/en/traicion-del-gobierno-al-pueblo-espanol-audios-mp3_rf_180381816_1.html'
          curl -LfsS -A 'Mozilla/5.0' "$PAGE" -o /tmp/page.html
          grep -Eo 'https://static-nweb\.ivoox\.com/[A-Za-z0-9._-]+\.js' /tmp/page.html | sort -u > /tmp/jsurls.txt
          mkdir -p /tmp/js
          n=0
          while read -r U; do
            n=$((n+1)); curl -LfsS --connect-timeout 8 --max-time 30 "$U" -o "/tmp/js/$n.js" || true
          done < /tmp/jsurls.txt
          python3 - <<'PY'
          import glob,os,re
          needles=['player:play','player:toggle','mediaUrl','listen_mn_','downloadUrl','new Audio','Audio(']
          for fn in glob.glob('/tmp/js/*.js'):
              s=open(fn,encoding='utf-8',errors='ignore').read()
              for needle in needles:
                  start=0
                  while True:
                      pos=s.find(needle,start)
                      if pos<0: break
                      a=max(0,pos-2400); b=min(len(s),pos+6000)
                      print('===== FILE',os.path.basename(fn),'NEEDLE',needle,'POS',pos,'=====')
                      print(s[a:b])
                      print('\n---END---')
                      start=pos+len(needle)
                      if start>pos+len(needle)+1: break
          PY
