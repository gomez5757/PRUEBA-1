name: Temporary inspect iVoox RSS

on:
  push:
    paths:
      - ".github/workflows/temp-ivoox-audio-20260924.yml"

permissions: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect RSS entries for the three target episodes
        shell: bash
        run: |
          set -euo pipefail
          curl -LfsS 'https://feeds.ivoox.com/feed_fg_f1781509_filtro_1.xml' -o /tmp/feed.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('/tmp/feed.xml').getroot()
          for item in root.findall('.//item'):
              text=' '.join((item.findtext('title') or '', item.findtext('guid') or '', item.findtext('link') or ''))
              if any(x in text for x in ['180328233','180381816','180552857','Los informes del CNI','La traición del Gobierno','La Junta Electoral']):
                  print('---ITEM---')
                  for child in item:
                      tag=child.tag.split('}')[-1]
                      if tag in {'title','guid','link','enclosure','duration','content','encoded'}:
                          print(tag, child.attrib, (child.text or '')[:1000])
          PY
