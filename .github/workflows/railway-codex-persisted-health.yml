name: Railway persisted Codex health

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/railway-codex-persisted-health.yml"
  workflow_dispatch:

jobs:
  health:
    runs-on: [self-hosted, railway, luna]
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned Codex
        run: npm install -g @openai/codex@0.155.0-alpha.9.2
      - name: Verify persistent auth and Luna Max
        shell: bash
        run: |
          set -euo pipefail
          findmnt /root/.codex
          codex login status
          printf '' | codex exec --skip-git-repo-check --ephemeral --sandbox read-only             -m gpt-5.6-luna -c model_reasoning_effort=max             "Reply with exactly PERSISTED_LUNA_OK and nothing else." 2>&1 | tee /tmp/persisted-luna.log
          grep -q "PERSISTED_LUNA_OK" /tmp/persisted-luna.log
          echo "PERSISTED_LUNA_VERIFIED=yes"
