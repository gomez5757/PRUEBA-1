name: Railway Codex compatible login

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/railway-codex-compatible-login.yml"
  workflow_dispatch:

jobs:
  login:
    runs-on: [self-hosted, railway, luna]
    permissions:
      contents: read
    timeout-minutes: 18

    steps:
      - name: Install working Codex version
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @openai/codex@0.155.0-alpha.9.2
          codex --version
          findmnt /root/.codex
          mkdir -p /root/.codex
          chmod 700 /root/.codex

      - name: ChatGPT device login
        shell: bash
        run: |
          set -euo pipefail
          codex login --device-auth 2>&1 | tee /proc/1/fd/1

      - name: Verify persistent ChatGPT login
        shell: bash
        run: |
          set -euo pipefail
          codex login status
          test -f /root/.codex/auth.json
          chmod 600 /root/.codex/auth.json
          echo "CHATGPT_LOGIN_VERIFIED=yes"

      - name: Verify Luna Max
        shell: bash
        run: |
          set -euo pipefail
          printf '' | codex exec             --skip-git-repo-check             --ephemeral             --sandbox read-only             -m gpt-5.6-luna             -c model_reasoning_effort=max             "Reply with exactly RAILWAY_LUNA_MAX_OK and nothing else."             2>&1 | tee /tmp/luna-max.log
          grep -q "RAILWAY_LUNA_MAX_OK" /tmp/luna-max.log
          echo "RAILWAY_LUNA_MAX_VERIFIED=yes"
