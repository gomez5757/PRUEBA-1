name: Luna Public Worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - .github/workflows/luna-public-worker.yml
      - scripts/luna_public_fabric.mjs

permissions:
  contents: read
  id-token: write

concurrency:
  group: luna-public-fabric-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    name: Claim one private Diana cycle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_work: ${{ steps.plan.outputs.has_work }}
      cycle_id: ${{ steps.plan.outputs.cycle_id }}
      tasks: ${{ steps.plan.outputs.tasks }}
    env:
      LUNA_AUTH_BROKER: https://luna-engine-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: plan
        name: Claim pending work without exposing prompts
        shell: bash
        run: |
          set -euo pipefail
          CLAIM="$RUNNER_TEMP/claim.json"
          node scripts/luna_public_fabric.mjs claim "$LUNA_AUTH_BROKER" > "$CLAIM"
          node - "$CLAIM" "$GITHUB_OUTPUT" <<'NODE'
          const fs=require("fs");
          const [file,out]=process.argv.slice(2);
          const d=JSON.parse(fs.readFileSync(file,"utf8"));
          fs.appendFileSync(out, "has_work="+(d.has_work?"true":"false")+"\n");
          fs.appendFileSync(out, "cycle_id="+(d.cycle_id||"")+"\n");
          fs.appendFileSync(out, "tasks="+JSON.stringify(d.task_ids||[])+"\n");
          NODE
          rm -f "$CLAIM"

  worker:
    name: Luna Max / ${{ matrix.task }}
    needs: plan
    if: needs.plan.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        task: ${{ fromJSON(needs.plan.outputs.tasks) }}
    env:
      LUNA_AUTH_BROKER: https://luna-engine-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install isolated Codex CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://chatgpt.com/codex/install.sh | CODEX_NON_INTERACTIVE=1 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          codex --version

      - name: Execute trusted private task with Luna Max only
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          unset OPENAI_API_KEY CODEX_API_KEY CODEX_ACCESS_TOKEN || true
          node scripts/luna_public_fabric.mjs run "$LUNA_AUTH_BROKER" "${{ needs.plan.outputs.cycle_id }}" "${{ matrix.task }}"
