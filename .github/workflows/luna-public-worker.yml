name: Luna Public Worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - .github/workflows/luna-public-worker.yml
      - scripts/luna_public_fabric.mjs
      - .luna-public-wake

permissions:
  contents: read
  id-token: write

concurrency:
  group: luna-public-fabric-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    name: Claim one private Diana cycle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_work: ${{ steps.plan.outputs.has_work }}
      cycle_id: ${{ steps.plan.outputs.cycle_id }}
      tasks: ${{ steps.plan.outputs.tasks }}
    env:
      LUNA_AUTH_BROKER: https://luna-engine-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: plan
        name: Claim pending work without exposing prompts
        shell: bash
        run: |
          set -euo pipefail
          CLAIM="$RUNNER_TEMP/claim.json"
          node scripts/luna_public_fabric.mjs claim "$LUNA_AUTH_BROKER" > "$CLAIM"
          node - "$CLAIM" "$GITHUB_OUTPUT" <<'NODE'
          const fs=require("fs");
          const [file,out]=process.argv.slice(2);
          const d=JSON.parse(fs.readFileSync(file,"utf8"));
          fs.appendFileSync(out, "has_work="+(d.has_work?"true":"false")+"\n");
          fs.appendFileSync(out, "cycle_id="+(d.cycle_id||"")+"\n");
          fs.appendFileSync(out, "tasks="+JSON.stringify(d.task_ids||[])+"\n");
          NODE
          rm -f "$CLAIM"

  worker:
    name: Luna Max / ${{ matrix.task }}
    needs: plan
    if: needs.plan.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        task: ${{ fromJSON(needs.plan.outputs.tasks) }}
    env:
      LUNA_AUTH_BROKER: https://luna-engine-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install isolated Codex CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://chatgpt.com/codex/install.sh | CODEX_NON_INTERACTIVE=1 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          codex --version

      - name: Execute trusted private task with Luna Max only
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          unset OPENAI_API_KEY CODEX_API_KEY CODEX_ACCESS_TOKEN || true
          node scripts/luna_public_fabric.mjs run "$LUNA_AUTH_BROKER" "${{ needs.plan.outputs.cycle_id }}" "${{ matrix.task }}"

  sandbox_probe:
    name: Codex Linux sandbox probe
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'sandbox probe')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LUNA_AUTH_BROKER: https://luna-engine-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Inspect Linux sandbox prerequisites
        shell: bash
        run: |
          set -euo pipefail
          echo "bwrap=$(command -v bwrap || true)"
          sysctl kernel.unprivileged_userns_clone 2>/dev/null || true
          sysctl user.max_user_namespaces 2>/dev/null || true

      - name: Install Codex and lease ChatGPT auth
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://chatgpt.com/codex/install.sh | CODEX_NON_INTERACTIVE=1 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          echo "CODEX_HOME=$RUNNER_TEMP/codex-home" >> "$GITHUB_ENV"
          node scripts/luna_hosted_auth.mjs lease "$LUNA_AUTH_BROKER" "$RUNNER_TEMP/codex-home"

      - name: Probe raw Codex Linux sandbox
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p "$RUNNER_TEMP/sandbox-probe"
          cd "$RUNNER_TEMP/sandbox-probe"
          codex sandbox linux -- bash -lc 'printf "RAW_SANDBOX_OK\n" > raw.txt'
          cat raw.txt

      - name: Probe Luna workspace-write tools
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          unset OPENAI_API_KEY CODEX_API_KEY CODEX_ACCESS_TOKEN || true
          cd "$RUNNER_TEMP/sandbox-probe"
          codex exec --skip-git-repo-check --ephemeral --ignore-user-config --sandbox workspace-write --color never -m gpt-5.6-luna -c model_reasoning_effort=max -c agents.enabled=false "Use your local command or patch tools to create probe.txt containing exactly LUNA_WORKSPACE_WRITE_OK followed by a newline. Then verify the file exists and reply exactly DONE."
          test "$(cat probe.txt)" = "LUNA_WORKSPACE_WRITE_OK"

      - name: Persist auth and clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$CODEX_HOME/auth.json" ] && [ -f "$CODEX_HOME/.lease.json" ]; then
            node scripts/luna_hosted_auth.mjs commit "$LUNA_AUTH_BROKER" "$CODEX_HOME"
          fi
          rm -rf "$CODEX_HOME" "$RUNNER_TEMP/sandbox-probe"
