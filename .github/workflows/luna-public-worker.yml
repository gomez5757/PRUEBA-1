name: Luna safety validation - execution paused

# Inference is deliberately disabled. The session-handling worker update was
# blocked by the platform safety control. Do not restore or route around it.
# The previously validated sandbox workflow is preserved on:
# backup/luna-working-sandbox-before-security-gate-20260921
# This workflow runs deterministic tests only: no OIDC, no auth lease, no model.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - .github/workflows/luna-public-worker.yml
      - scripts/luna_safety.mjs
      - tests/luna_safety.test.mjs

permissions:
  contents: read

concurrency:
  group: luna-safety-validation
  cancel-in-progress: false

jobs:
  validate:
    name: Credential-free policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read exact infrastructure commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify source syntax and policy regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/luna_safety.mjs
          node --test tests/luna_safety.test.mjs
      - name: State readiness separately from tests
        shell: bash
        run: |
          printf '%s\n' 'POLICY_TESTS=PASS' 'LUNA_RUNTIME=PAUSED_SECURITY_REVIEW' 'INFERENCE_CALLS=0' 'SCHEDULER=DISABLED'
          printf '%s\n' '## Runtime remains paused' 'Passing policy tests do not mean that the autonomous pipeline is operational.' >> "$GITHUB_STEP_SUMMARY"
