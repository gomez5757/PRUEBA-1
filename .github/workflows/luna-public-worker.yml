name: Luna Public Worker

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/luna-public-worker.yml
      - scripts/luna_hosted_auth.mjs
      - .luna-public-smoke
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    name: Luna Max only public-runner smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LUNA_AUTH_BROKER: https://luna-engine-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare isolated Codex runtime
        shell: bash
        run: |
          set -euo pipefail
          echo "CODEX_HOME=$RUNNER_TEMP/codex-home" >> "$GITHUB_ENV"
          curl -fsSL https://chatgpt.com/codex/install.sh | CODEX_NON_INTERACTIVE=1 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          codex --version

      - name: Lease ChatGPT auth through OIDC
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 30); do
            rm -rf "$CODEX_HOME"
            if node scripts/luna_hosted_auth.mjs lease "$LUNA_AUTH_BROKER" "$CODEX_HOME"; then
              ok=1
              break
            fi
            sleep 3
          done
          test "$ok" -eq 1

      - name: Verify subscription login and no API fallback
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          unset OPENAI_API_KEY CODEX_API_KEY CODEX_ACCESS_TOKEN || true
          codex login status | tee "$RUNNER_TEMP/login-status.txt"
          grep -qi "chatgpt" "$RUNNER_TEMP/login-status.txt"
          test -z "${OPENAI_API_KEY:-}"
          test -z "${CODEX_API_KEY:-}"
          test -z "${CODEX_ACCESS_TOKEN:-}"

      - name: Execute Luna Max only
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          unset OPENAI_API_KEY CODEX_API_KEY CODEX_ACCESS_TOKEN || true
          LOG="$RUNNER_TEMP/luna-smoke.log"
          set +e
          codex exec --skip-git-repo-check --ephemeral --ignore-user-config --sandbox read-only --color never -m gpt-5.6-luna -c model_reasoning_effort=max -c agents.enabled=false "Reply with exactly PUBLIC_GITHUB_LUNA_MAX_OK and nothing else." 2>&1 | tee "$LOG"
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -eq 0
          grep -q "PUBLIC_GITHUB_LUNA_MAX_OK" "$LOG"
          if grep -Eqi 'model:[[:space:]]*(gpt-5\.6-(astra|sol|terra)|[^[:space:]]*astra)' "$LOG"; then
            echo "Forbidden non-Luna model observed" >&2
            exit 1
          fi
          echo "PUBLIC_LUNA_ONLY_SMOKE_OK=yes"

      - name: Persist refreshed auth with compare-and-swap
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$CODEX_HOME/auth.json" ] && [ -f "$CODEX_HOME/.lease.json" ]; then
            node scripts/luna_hosted_auth.mjs commit "$LUNA_AUTH_BROKER" "$CODEX_HOME"
          fi

      - name: Destroy ephemeral credential copy
        if: always()
        shell: bash
        run: |
          rm -rf "$CODEX_HOME" "$RUNNER_TEMP/login-status.txt" "$RUNNER_TEMP/luna-smoke.log"
